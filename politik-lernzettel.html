<style>

@media (prefers-color-scheme:dark){:root{--bg:#12161f;--card:#1b212d;--text:#e6e9f0;--muted:#9aa3b5;--accent:#6b9bff;--accent2:#ffa45c;--ok:#4fc88a;--bad:#ff7b6b;--line:#2c3446;--soft:#222b3d}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.55}
header{padding:20px 16px 8px;max-width:960px;margin:auto}
h1{margin:0;font-size:1.6rem}
header p{margin:4px 0 0;color:var(--muted)}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px}
.tabs{max-width:960px;margin:auto;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:.9rem}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:960px;margin:auto;padding:16px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:10px 0 0}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.card>button.h{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 16px;cursor:pointer;font-weight:600}
.card>button.h:focus-visible{outline:2px solid var(--accent)}
.card .b{display:none;padding:0 16px 14px}
.card.open .b{display:block}
.card.open .chev{transform:rotate(90deg)}
.chev{transition:.2s;color:var(--muted)}
.b ul{margin:6px 0 6px 18px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{background:var(--soft);color:var(--accent);padding:6px 12px;border-radius:10px;font-weight:600;font-size:.92rem}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0}
.flow span.s{background:var(--soft);border:1px solid var(--line);padding:8px 10px;border-radius:10px;font-size:.88rem}
.flow span.a{color:var(--accent2);font-weight:700}
.note{background:var(--soft);border-left:4px solid var(--accent2);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:.92rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:8px 0}
.grid div{background:var(--soft);border-radius:10px;padding:10px}
.grid b{display:block;color:var(--accent)}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:9px 16px;border-radius:10px;cursor:pointer;font-size:.95rem}
.btn.alt{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.fc{perspective:900px;margin:14px 0}
.fc .in{position:relative;min-height:200px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .k{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:1.15rem;border:1px solid var(--line)}
.fc .f{background:var(--card)}
.fc .k{background:var(--accent);color:#fff;transform:rotateY(180deg)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:11px 14px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;cursor:pointer;font-size:.97rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.ord{display:flex;flex-direction:column;gap:8px}
.ord button{text-align:left;padding:11px 14px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;cursor:pointer;font-size:.95rem}
.ord button.used{opacity:.4}
.slot{padding:9px 12px;border-radius:10px;margin:6px 0;background:var(--soft)}
.slot.ok{background:var(--ok);color:#fff}.slot.bad{background:var(--bad);color:#fff}
.muted{color:var(--muted)}
.vid{display:inline-flex;align-items:center;gap:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--card);border-radius:14px;max-width:900px;width:100%;padding:12px;max-height:100%;overflow:auto}
.modal .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.modal video{width:100%;max-height:70vh;border-radius:10px;background:#000}
.modal .err{display:none;padding:12px;background:var(--soft);border-radius:10px;margin-top:8px}

.done{color:var(--ok);font-weight:600}
</style>
</head>

{q:"Welches Recht gehört zu den Rechten der Betroffenen beim Datenschutz?",o:["Löschung","Veto","Koalition","Gewaltenteilung"],c:0},
{q:"Was wird im Verteidigungsfall gebildet, wenn der Bundestag handlungsunfähig ist?",o:["Ein Bundesrat","Ein Gemeinsamer Ausschuss","Ein Verfassungsgericht","Ein Koalitionsausschuss"],c:1},
{q:"Wann wurde die UNO gegründet und wie viele Mitglieder hat sie?",o:["1919; 58","1945; 193","1949; 100","1990; 200"],c:1},
{q:"Wie viele ständige Mitglieder hat der UN-Sicherheitsrat?",o:["3","10","5","15"],c:2},
{q:"Wen verfolgt der IStGH?",o:["Staaten","Einzelpersonen","Unternehmen","Parteien"],c:1}
];

var order=["Was kann man ändern?","Bundesrat hat 6 Wochen Zeit","Im Bundestag gibt es 3 Lesungen","Bei der 2. und 3. Lesung: Änderungsvorschläge und Entwurf","Prüfung vom Bundesrat","Unterzeichnung vom Bundespräsidenten","Bundesgesetzblatt"];

// ---------- Hilfen ----------
function $(id){return document.getElementById(id)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}

var tabs=topics.map(function(t){return{id:t.id,label:t.title}}).concat([{id:'flash',label:'Karteikarten'},{id:'quiz',label:'Quiz'},{id:'order',label:'Reihenfolge'}]);
var current=tabs[0].id;

function updateProgress(){
  var total=topics.reduce(function(n,t){return n+t.cards.length},0);
  var s=Object.keys(seen).length, k=Object.keys(known).length;
  var pct=Math.round(((s/total)+(k/flash.length))/2*100);
  $('prog').style.width=pct+'%';
  $('progtxt').textContent='Gelesen: '+s+'/'+total+' · Karteikarten gewusst: '+k+'/'+flash.length;
}

function renderTabs(){
  $('tabs').innerHTML='';
  tabs.forEach(function(t){
    var b=document.createElement('button');
    b.textContent=t.label;
    if(t.id===current)b.className='on';
    b.onclick=function(){current=t.id;render();window.scrollTo(0,0)};
    $('tabs').appendChild(b);
  });
}

function render(){
  renderTabs();updateProgress();
  var t=topics.filter(function(x){return x.id===current})[0];
  if(t)return renderTopic(t);
  if(current==='flash')return renderFlash();
  if(current==='quiz')return renderQuiz();
  renderOrder();
}

// ---------- Themen ----------
function renderTopic(t){
  var m=$('main');m.innerHTML='<h2>'+t.title+'</h2><div class="row"><button class="btn" id="vbtn">▶ Video ansehen</button><button class="btn alt" id="all">Alle auf-/zuklappen</button></div>';
  $('vbtn').onclick=function(){openVideo(t.id,t.title)};
  var cards=[];
  t.cards.forEach(function(c,i){
    var key=t.id+i;
    var d=document.createElement('div');d.className='card'+(seen[key]?'':'');
    d.innerHTML='<button class="h"><span>'+(seen[key]?'<span class="done">✓ </span>':'')+c.t+'</span><span class="chev">›</span></button><div class="b">'+c.h+'</div>';
    d.querySelector('.h').onclick=function(){
      d.classList.toggle('open');
      if(!seen[key]){seen[key]=1;store.set('pol_seen',seen);d.querySelector('.h span').innerHTML='<span class="done">✓ </span>'+c.t;updateProgress()}
    };
    cards.push(d);m.appendChild(d);
  });
  $('all').onclick=function(){var open=cards.some(function(c){return!c.classList.contains('open')});cards.forEach(function(c){if(open&&!c.classList.contains('open'))c.querySelector('.h').click();else if(!open)c.classList.remove('open')})};
}

// ---------- Karteikarten ----------
var deck=[],di=0,onlyOpen=false;
function buildDeck(){deck=shuffle(flash.map(function(_,i){return i}).filter(function(i){return!onlyOpen||!known[i]}));di=0}
function renderFlash(){
  if(!deck.length&&!onlyOpen)buildDeck();
  var m=$('main');
  if(!deck.length){m.innerHTML='<h2>Karteikarten</h2><p class="done">Alle Karten gewusst! 🎉</p><button class="btn" id="rst">Alle zurücksetzen</button>';
    $('rst').onclick=function(){known={};store.set('pol_known',known);onlyOpen=false;deck=[];render()};return}
  if(di>=deck.length){m.innerHTML='<h2>Karteikarten</h2><p>Runde fertig. Gewusst: '+Object.keys(known).length+'/'+flash.length+'</p><div class="row"><button class="btn" id="again">Offene Karten wiederholen</button><button class="btn alt" id="rst">Alles zurücksetzen</button></div>';
    $('again').onclick=function(){onlyOpen=true;buildDeck();render()};
    $('rst').onclick=function(){known={};store.set('pol_known',known);onlyOpen=false;buildDeck();render()};return}
  var idx=deck[di],c=flash[idx];
  m.innerHTML='<h2>Karteikarten</h2><p class="muted">Karte '+(di+1)+' von '+deck.length+(onlyOpen?' (nur offene)':'')+' · Klick zum Umdrehen</p>'+
   '<div class="fc" id="fc"><div class="in"><div class="f">'+esc(c[0])+'</div><div class="k">'+esc(c[1])+'</div></div></div>'+
   '<div class="row"><button class="btn" id="yes">Gewusst</button><button class="btn alt" id="no">Nochmal</button></div>';
  $('fc').onclick=function(){this.classList.toggle('flip')};
  $('yes').onclick=function(){known[idx]=1;store.set('pol_known',known);di++;render()};
  $('no').onclick=function(){delete known[idx];store.set('pol_known',known);di++;render()};
}

// ---------- Quiz ----------
var qs=[],qi=0,score=0,answered=false;
function startQuiz(){qs=shuffle(quiz);qi=0;score=0;answered=false}
function renderQuiz(){
  if(!qs.length)startQuiz();
  var m=$('main');
  if(qi>=qs.length){var best=store.get('pol_best',0);if(score>best){best=score;store.set('pol_best',best)}
    m.innerHTML='<h2>Quiz</h2><p style="font-size:1.3rem"><b>'+score+' / '+qs.length+'</b> richtig</p><p class="muted">Bestwert: '+best+'</p><button class="btn" id="re">Nochmal</button>';
    $('re').onclick=function(){startQuiz();render()};return}
  var q=qs[qi];
  var order2=shuffle(q.o.map(function(_,i){return i}));
  m.innerHTML='<h2>Quiz</h2><p class="muted">Frage '+(qi+1)+' von '+qs.length+' · Punkte: '+score+'</p><h3>'+q.q+'</h3><div id="opts"></div><div class="row"><button class="btn" id="next" disabled>Weiter</button></div>';
  answered=false;
  order2.forEach(function(oi){
    var b=document.createElement('button');b.className='opt';b.textContent=q.o[oi];
    b.onclick=function(){
      if(answered)return;answered=true;
      var all=$('opts').children;
      for(var k=0;k<all.length;k++){all[k].disabled=true}
      if(oi===q.c){b.classList.add('ok');score++}
      else{b.classList.add('bad');for(var k2=0;k2<all.length;k2++){if(all[k2].textContent===q.o[q.c])all[k2].classList.add('ok')}}
      $('next').disabled=false;
    };
    $('opts').appendChild(b);
  });
  $('next').onclick=function(){qi++;render()};
}

// ---------- Reihenfolge ----------
var pick=[],shuf=[];
function renderOrder(){
  var m=$('main');
  if(!shuf.length){shuf=shuffle(order);pick=[]}
  var checked=pick.length===order.length;
  var h='<h2>Wie entsteht ein Gesetz?</h2><p class="muted">Tippe die Schritte in der richtigen Reihenfolge an.</p><div class="ord" id="ord"></div><h3>Deine Reihenfolge</h3><div id="slots"></div><div class="row"><button class="btn alt" id="undo">Zurück</button><button class="btn alt" id="rs">Neu mischen</button></div><p id="res"></p>';
  m.innerHTML=h;
  shuf.forEach(function(s){
    var b=document.createElement('button');b.textContent=s;
    if(pick.indexOf(s)>-1){b.className='used';b.disabled=true}
    b.onclick=function(){pick.push(s);renderOrder()};
    $('ord').appendChild(b);
  });
  pick.forEach(function(s,i){
    var d=document.createElement('div');d.className='slot';d.textContent=(i+1)+'. '+s;
    if(checked)d.classList.add(order[i]===s?'ok':'bad');
    $('slots').appendChild(d);
  });
  if(checked){var right=pick.filter(function(s,i){return order[i]===s}).length;
    $('res').innerHTML=right===order.length?'<span class="done">Richtig! Alle 7 Schritte sitzen. 🎉</span>':'<b>'+right+' von 7 an der richtigen Stelle.</b> Richtige Reihenfolge:<ol>'+order.map(function(o){return'<li>'+o+'</li>'}).join('')+'</ol>'}
  $('undo').onclick=function(){pick.pop();renderOrder()};
  $('rs').onclick=function(){shuf=[];renderOrder()};
}

$('mclose').onclick=closeVideo;
$('modal').onclick=function(e){if(e.target===this)closeVideo()};
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeVideo()});
$('mvideo').addEventListener('error',function(){if(this.getAttribute('src'))$('merr').style.display='block'});
render();
</script>
