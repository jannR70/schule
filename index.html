<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lernzettel-Übersicht</title>
  
  <!-- Externe Datendatei einbinden -->
  <script src="quelle.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #0f172a;
      --nav-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--nav-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-shrink: 0;
      height: 60px;
    }

    .logo-title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 1.1rem;
      white-space: nowrap;
    }

    .nav-tabs-wrapper {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      overflow-x: auto;
      flex: 1;
      scrollbar-width: thin;
      scrollbar-color: var(--border-color) transparent;
    }

    .tab-btn {
      background: #334155;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tab-btn:hover {
      background: #475569;
      color: var(--text-main);
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .tab-btn .badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      font-size: 0.75rem;
    }

    .download-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      transition: background 0.2s ease;
    }

    .download-link:hover {
      background: #334155;
      color: var(--text-main);
    }

    main {
      flex: 1;
      width: 100%;
      height: calc(100vh - 60px);
      position: relative;
    }

    .viewer-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #ffffff;
    }

    .fallback-message {
      padding: 3rem;
      text-align: center;
      color: var(--text-muted);
      background: var(--bg-color);
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1rem;
    }

    .fallback-message a {
      color: #818cf8;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-title">
      <span>📚</span>
      <span>Lernzettel</span>
    </div>

    <nav class="nav-tabs-wrapper" id="tabsContainer">
      <!-- Tabs werden dynamisch geladen -->
    </nav>

    <a id="downloadBtn" class="download-link" href="#" target="_blank" title="In neuem Tab öffnen">↗️ Extern öffnen</a>
  </header>

  <main>
    <object id="docViewer" class="viewer-frame" data="" type="application/pdf">
      <iframe id="docIframe" class="viewer-frame" src="">
        <div class="fallback-message">
          <p>Ihr Browser unterstützt die direkte Vorschau nicht.</p>
          <p><a id="fallbackLink" href="#" target="_blank">Klicken Sie hier, um den Lernzettel zu öffnen.</a></p>
        </div>
      </iframe>
    </object>
  </main>

  <script>
    function initPortal() {
      // Prüfen, ob die Variable aus quelle.js geladen wurde
      if (typeof lernzettelData !== 'undefined' && lernzettelData.length > 0) {
        renderTabs();
        openDocument(lernzettelData[0].id);
      } else {
        console.error("quelle.js wurde nicht gefunden oder ist leer.");
        document.body.innerHTML = '<div class="fallback-message"><p style="color: #ef4444;">Fehler: Die Datei <b>quelle.js</b> konnte nicht geladen werden.</p></div>';
      }
    }

    function renderTabs() {
      const container = document.getElementById('tabsContainer');
      container.innerHTML = '';

      lernzettelData.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'tab-btn';
        btn.id = `tab-${item.id}`;
        btn.onclick = () => openDocument(item.id);
        btn.innerHTML = `
          <span>${item.titel}</span>
          <span class="badge">${item.fach}</span>
        `;
        container.appendChild(btn);
      });
    }

    function openDocument(id) {
      const item = lernzettelData.find(d => d.id === id);
      if (!item) return;

      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeTab = document.getElementById(`tab-${id}`);
      if (activeTab) {
        activeTab.classList.add('active');
        activeTab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }

      const viewer = document.getElementById('docViewer');
      const iframe = document.getElementById('docIframe');
      const downloadBtn = document.getElementById('downloadBtn');
      const fallbackLink = document.getElementById('fallbackLink');

      if (viewer) viewer.data = item.dateiUrl;
      if (iframe) iframe.src = item.dateiUrl;
      if (downloadBtn) downloadBtn.href = item.dateiUrl;
      if (fallbackLink) fallbackLink.href = item.dateiUrl;
    }

    document.addEventListener('DOMContentLoaded', initPortal);
  </script>
</body>
</html>
